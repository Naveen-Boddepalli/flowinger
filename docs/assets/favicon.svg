<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="favTop" x1="17" y1="17" x2="47" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="favStem" x1="17" y1="17" x2="17" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="favMid" x1="17" y1="33" x2="39" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="favCurve" x1="32" y1="17" x2="39" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Dark Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Smooth Curved Flow Branch -->
  <path d="M 32 17 C 32 25, 39 25, 39 33" stroke="url(#favCurve)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Flowinger 'F' Graph Edges -->
  <path d="M 17 17 H 47" stroke="url(#favTop)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 17 17 V 49" stroke="url(#favStem)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 17 33 H 39" stroke="url(#favMid)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Nodes / Ports -->
  <circle cx="17" cy="17" r="4" fill="#38bdf8" />
  <circle cx="32" cy="17" r="3" fill="#60a5fa" />
  <circle cx="47" cy="17" r="4" fill="#818cf8" />
  <circle cx="17" cy="33" r="4" fill="#6366f1" />
  <circle cx="39" cy="33" r="4" fill="#c084fc" />
  <circle cx="17" cy="49" r="4" fill="#a855f7" />
</svg>
