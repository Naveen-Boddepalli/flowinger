<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowingerBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="flowingerBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.45" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Edge Gradients -->
    <linearGradient id="topEdgeGrad" x1="136" y1="124" x2="376" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="stemEdgeGrad" x1="136" y1="124" x2="136" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="midEdgeGrad" x1="136" y1="256" x2="304" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="curveBranchGrad" x1="256" y1="146" x2="304" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="loopGrad" x1="164" y1="256" x2="164" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#flowingerBg)" stroke="url(#flowingerBorder)" stroke-width="3" />

  <!-- Flowinger Canvas Dot Grid Preview -->
  <g opacity="0.12" fill="#94a3b8">
    <circle cx="80" cy="80" r="2.5"/>
    <circle cx="160" cy="80" r="2.5"/>
    <circle cx="240" cy="80" r="2.5"/>
    <circle cx="320" cy="80" r="2.5"/>
    <circle cx="400" cy="80" r="2.5"/>

    <circle cx="80" cy="160" r="2.5"/>
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="240" cy="160" r="2.5"/>
    <circle cx="320" cy="160" r="2.5"/>
    <circle cx="400" cy="160" r="2.5"/>

    <circle cx="80" cy="240" r="2.5"/>
    <circle cx="160" cy="240" r="2.5"/>
    <circle cx="240" cy="240" r="2.5"/>
    <circle cx="320" cy="240" r="2.5"/>
    <circle cx="400" cy="240" r="2.5"/>

    <circle cx="80" cy="320" r="2.5"/>
    <circle cx="160" cy="320" r="2.5"/>
    <circle cx="240" cy="320" r="2.5"/>
    <circle cx="320" cy="320" r="2.5"/>
    <circle cx="400" cy="320" r="2.5"/>

    <circle cx="80" cy="400" r="2.5"/>
    <circle cx="160" cy="400" r="2.5"/>
    <circle cx="240" cy="400" r="2.5"/>
    <circle cx="320" cy="400" r="2.5"/>
    <circle cx="400" cy="400" r="2.5"/>
  </g>

  <!-- Ambient Glow Layer behind edges -->
  <g filter="url(#neonGlow)" opacity="0.45">
    <path d="M 136 124 H 376" stroke="url(#topEdgeGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 136 124 V 388" stroke="url(#stemEdgeGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 136 256 H 304" stroke="url(#midEdgeGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 256 124 C 256 195, 304 185, 304 256" stroke="url(#curveBranchGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- Secondary decorative flow edge (Bezier Loop) -->
  <path d="M 164 256 C 230 280, 230 365, 164 388" stroke="url(#loopGrad)" stroke-width="4.5" stroke-dasharray="7 7" fill="none" stroke-linecap="round" />

  <!-- Primary Crisp SVG Edges -->
  <!-- Smooth Curved Bezier Branch: Top-Mid to Mid-Right -->
  <path d="M 256 124 C 256 195, 304 185, 304 256" stroke="url(#curveBranchGrad)" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Top Bar Edge -->
  <path d="M 136 124 H 376" stroke="url(#topEdgeGrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Vertical Stem Edge -->
  <path d="M 136 124 V 388" stroke="url(#stemEdgeGrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Mid Bar Edge -->
  <path d="M 136 256 H 304" stroke="url(#midEdgeGrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Graph Nodes (HTML Nodes with Handles) -->

  <!-- Node A (Top-Left Root: Input) -->
  <g filter="url(#softGlow)">
    <rect x="106" y="94" width="60" height="60" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <circle cx="136" cy="124" r="9" fill="#38bdf8" />
    <circle cx="166" cy="124" r="5" fill="#38bdf8" stroke="#0b1120" stroke-width="2.5" />
    <circle cx="136" cy="154" r="5" fill="#38bdf8" stroke="#0b1120" stroke-width="2.5" />
  </g>

  <!-- Node B1 (Top-Mid Intermediate: Transform) -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="124" r="26" fill="#0f172a" stroke="#60a5fa" stroke-width="3" />
    <circle cx="256" cy="124" r="8" fill="#60a5fa" />
    <circle cx="230" cy="124" r="5" fill="#60a5fa" stroke="#0b1120" stroke-width="2" />
    <circle cx="282" cy="124" r="5" fill="#60a5fa" stroke="#0b1120" stroke-width="2" />
    <circle cx="256" cy="150" r="5" fill="#60a5fa" stroke="#0b1120" stroke-width="2" />
  </g>

  <!-- Node B2 (Top-Right Terminal: Output) -->
  <g filter="url(#softGlow)">
    <rect x="346" y="94" width="60" height="60" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="3" />
    <circle cx="376" cy="124" r="9" fill="#818cf8" />
    <circle cx="346" cy="124" r="5" fill="#818cf8" stroke="#0b1120" stroke-width="2.5" />
  </g>

  <!-- Node C (Mid-Left Hub: Join) -->
  <g filter="url(#softGlow)">
    <rect x="106" y="226" width="60" height="60" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="3" />
    <circle cx="136" cy="256" r="9" fill="#6366f1" />
    <circle cx="136" cy="226" r="5" fill="#6366f1" stroke="#0b1120" stroke-width="2.5" />
    <circle cx="166" cy="256" r="5" fill="#6366f1" stroke="#0b1120" stroke-width="2.5" />
    <circle cx="136" cy="286" r="5" fill="#6366f1" stroke="#0b1120" stroke-width="2.5" />
  </g>

  <!-- Node D (Mid-Right Output) -->
  <g filter="url(#softGlow)">
    <rect x="274" y="226" width="60" height="60" rx="18" fill="#0f172a" stroke="#c084fc" stroke-width="3" />
    <circle cx="304" cy="256" r="9" fill="#c084fc" />
    <circle cx="274" cy="256" r="5" fill="#c084fc" stroke="#0b1120" stroke-width="2.5" />
    <circle cx="304" cy="226" r="5" fill="#c084fc" stroke="#0b1120" stroke-width="2.5" />
  </g>

  <!-- Node E (Bottom-Left Sink: Export) -->
  <g filter="url(#softGlow)">
    <rect x="106" y="358" width="60" height="60" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="3" />
    <circle cx="136" cy="388" r="9" fill="#a855f7" />
    <circle cx="136" cy="358" r="5" fill="#a855f7" stroke="#0b1120" stroke-width="2.5" />
    <circle cx="166" cy="388" r="5" fill="#a855f7" stroke="#0b1120" stroke-width="2.5" />
  </g>
</svg>
