<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowinger: a small React Flow alternative (live demo)</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Flowinger is a small, dependency-free node-graph renderer for React: HTML nodes over SVG edges, with pan, zoom, drag and an API shaped like React Flow's. This is its interactive demo."
    />
    <meta property="og:title" content="Flowinger — a small node-graph renderer for React" />
    <meta
      property="og:description"
      content="HTML nodes over SVG edges, pan, zoom, drag and connect. React Flow's API in about 20 kB gzipped, with no dependencies; each feature adds only its own code."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naveen-boddepalli.github.io/flowinger/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Naveen-Boddepalli/flowinger/main/docs/assets/demo.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="llms.txt" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes ql-flow-dash {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      .is-active .flowinger-edge-path {
        stroke-dasharray: 4 4;
        animation: ql-flow-dash 0.6s linear infinite;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-hidden m-0 p-0 w-screen h-screen">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/demo/main.tsx"></script>
  </body>
</html>
