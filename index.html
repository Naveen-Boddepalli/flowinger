<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowinger Interactive Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes ql-flow-dash {
        from {
          stroke-dashoffset: 24;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      .is-active .flowinger-edge-path {
        stroke-dasharray: 4 4;
        animation: ql-flow-dash 0.6s linear infinite;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-hidden m-0 p-0 w-screen h-screen">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/demo/main.tsx"></script>
  </body>
</html>
