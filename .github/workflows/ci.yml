name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The package declares react >=18, so test both ends of that range.
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The pnpm version comes from `packageManager` in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Use React ${{ matrix.react }}
        if: matrix.react != '19'
        run: pnpm add --save-dev react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # What a small consumer pays: the whole canvas, and the core with no features (from src, then from
      # the built package — one pre-bundled file, where a stray top-level call keeps unused code alive).
      # Raise a budget deliberately, not by drift; the lean one is the one that matters.
      - run: pnpm size --max-full 37 --max-lean 20
      - run: node scripts/size-dist.mjs --max-lean 20
      # The package itself, once: exports, types for import *and* require, and what the tarball holds.
      # (publint and Are the Types Wrong — the failure they exist for is a consumer who cannot import it.)
      - name: Package is importable and typed for ESM and CJS
        if: matrix.react == '19'
        run: pnpm check:package
      # The coverage numbers in the docs come from this script, which reads TypeScript's in-process API — gone
      # in TypeScript 7, so it uses a 6.x alias. It broke once without a test failing; now it is run.
      - name: The React Flow coverage audit still runs
        if: matrix.react == '19'
        run: node scripts/audit-react-flow.mjs node_modules/@xyflow/react/dist/esm/index.d.ts

  demo:
    # The demo and the docs site are built from source (and docs/), so a change that breaks either should fail
    # the PR, not the deploy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm site:build

  examples:
    # Each example is built against the packed library — what a consumer installs — so one that stops
    # compiling fails the change that broke it. (scripts/check-examples.mjs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-examples.mjs

  e2e:
    # Real browsers against the demo — Chromium, Firefox and WebKit: layout, pointer capture, the wheel — what
    # jsdom cannot see (e2e/). The first place a drag that "works in the tests" shows it does not.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results

