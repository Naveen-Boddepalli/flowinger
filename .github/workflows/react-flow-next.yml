name: React Flow next

# React Flow's next major is published to its `next` dist-tag long before its release, and flowinger's 2.0 starts
# when that release does (PLAN-2.0.md). Until then, once a week, this runs flowinger's React Flow oracles against
# `@xyflow/react@next` — the unit tests that check names, geometry and defaults against React Flow's own code, and
# the coverage audit — so a change in React Flow shows up as each pre-release lands, not on release day. A failure
# here is news about React Flow, not a broken flowinger: CI stays on the version package.json pins.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Use @xyflow/react@next
        run: |
          pnpm add --save-dev @xyflow/react@next
          echo "React Flow $(node -p "require('@xyflow/react/package.json').version")" >> "$GITHUB_STEP_SUMMARY"
      # Among them, the test that reads each of reactFlowDefaults' values from React Flow's source.
      - run: pnpm test
      - run: pnpm build
      # The declarations its `exports` names: 13's package still carries an older build under dist/esm/, which nothing
      # reads.
      - name: Every React Flow name is here and does something
        run: |
          types=$(node -p "const p = require('@xyflow/react/package.json'), e = p.exports['.']; e.types ?? e.node?.types ?? p.types")
          node scripts/audit-react-flow.mjs "node_modules/@xyflow/react/$types" --strict
