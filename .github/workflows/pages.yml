name: Site

# Publishes the documentation site (site/) and the demo (index.html + demo/, under demo/) to GitHub Pages on
# every push to main (scripts/build-site.mjs). In the repository's Settings -> Pages, set the source to
# "GitHub Actions" once; the site is then at https://<owner>.github.io/flowinger/. The 1.x docs under v1/ are built
# from the v1 branch, so a docs fix there is on the site after the next push to main, or a manual run of this.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Every branch, and their history: the /v1/ pages are read from origin/v1, with their last-updated dates.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
