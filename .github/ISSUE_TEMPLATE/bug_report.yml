name: Bug report
description: Something is wrong, or behaves differently from React Flow where it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A bug I can see in a minute is a bug I can fix in an hour — a small repro is the most useful thing here.
        For a security problem, please do **not** open an issue: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "Dragging the node's right handle onto the second node does nothing; I expected onConnect to fire."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A link to a StackBlitz / CodeSandbox, or the smallest component that shows it. Include the `nodes`, `edges` and canvas props.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: flowinger version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: react
    attributes:
      label: React version
      placeholder: "19.2.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS (or "server render")
      placeholder: "Safari 19 on iOS 19; Chrome 140 on macOS"
  - type: dropdown
    id: reactflow
    attributes:
      label: Does React Flow (`@xyflow/react`) behave differently with the same input?
      description: Flowinger follows its behaviour, so a difference is the bug. "I haven't tried" is fine.
      options:
        - I haven't tried
        - Yes, React Flow does what I expected
        - No, React Flow does the same
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which canvas?
      options:
        - FlowingerCanvas (the whole canvas)
        - FlowingerCore with features
        - Not sure
